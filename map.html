// Natural Earth 1:50m admin-0 countries (includes dependencies as separate features)
const COUNTRIES_URL = "https://cdn.jsdelivr.net/gh/martynafford/natural-earth-geojson/50m/cultural/ne_50m_admin_0_countries.json";

// Build a lookup: ADMIN name -> [regions]
const byAdmin = {};
REGIONS.forEach(r => {
  (r.match || []).forEach(name => {
    if (!byAdmin[name]) byAdmin[name] = [];
    byAdmin[name].push(r);
  });
});

// Regions with a bounding-box override (sub-national areas not separated in the country polygons)
const bboxRegions = REGIONS.filter(r => r.bbox);

function findBboxMatches(lng, lat) {
  return bboxRegions.filter(r => {
    const [minLng, minLat, maxLng, maxLat] = r.bbox;
    return lng >= minLng && lng <= maxLng && lat >= minLat && lat <= maxLat;
  });
}

const map = new maplibregl.Map({
  container: "map",
  style: "https://demotiles.maplibre.org/style.json",
  center: [10, 25],
  zoom: 2
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

map.on("load", () => {
  map.addSource("countries", {
    type: "geojson",
    data: COUNTRIES_URL
  });

  map.addLayer({
    id: "countries-fill",
    type: "fill",
    source: "countries",
    paint: {
      "fill-color": "#3388ff",
      "fill-opacity": 0.05
    }
  });

  map.addLayer({
    id: "countries-hover",
    type: "fill",
    source: "countries",
    paint: {
      "fill-color": "#3388ff",
      "fill-opacity": [
        "case",
        ["boolean", ["feature-state", "hover"], false],
        0.35,
        0
      ]
    }
  });

  map.addLayer({
    id: "countries-outline",
    type: "line",
    source: "countries",
    paint: {
      "line-color": "#3388ff",
      "line-width": 0.6,
      "line-opacity": 0.6
    }
  });

  let hoveredId = null;

  map.on("mousemove", "countries-fill", (e) => {
    map.getCanvas().style.cursor = "pointer";
    if (e.features.length > 0) {
      if (hoveredId !== null) {
        map.setFeatureState({ source: "countries", id: hoveredId }, { hover: false });
      }
      hoveredId = e.features[0].id;
      map.setFeatureState({ source: "countries", id: hoveredId }, { hover: true });
    }
  });

  map.on("mouseleave", "countries-fill", () => {
    map.getCanvas().style.cursor = "";
    if (hoveredId !== null) {
      map.setFeatureState({ source: "countries", id: hoveredId }, { hover: false });
    }
    hoveredId = null;
  });

  map.on("click", (e) => {
    const { lng, lat } = e.lngLat;

    // 1. check sub-national bbox overrides first (Corsica, Canary Islands, Hawaii,
    //    French Guiana, Reunion, BES islands - these are not separate polygons in the
    //    50m country dataset)
    let matches = findBboxMatches(lng, lat);

    // 2. fall back to the country polygon clicked on
    let adminName = null;
    if (matches.length === 0) {
      const features = map.queryRenderedFeatures(e.point, { layers: ["countries-fill"] });
      if (features.length > 0) {
        adminName = features[0].properties.ADMIN || features[0].properties.NAME;
        matches = byAdmin[adminName] || [];
      }
    }

    let html;
    if (matches.length > 0) {
      html = matches.map(r => `
        <div class="region-block">
          <h3>${r.name}</h3>
          <table>
            <tr><td class="label">Horizontal</td><td>${r.horizontal}</td></tr>
            <tr><td class="label">Vertical</td><td>${r.vertical}</td></tr>
            <tr><td class="label">Compound</td><td>${r.compound}</td></tr>
          </table>
        </div>
      `).join("");
    } else {
      const label = adminName || "this location";
      html = `<div class="region-block"><p>No EPSG data available for <b>${label}</b> in this overview.</p></div>`;
    }

    new maplibregl.Popup({ maxWidth: "320px" })
      .setLngLat(e.lngLat)
      .setHTML(html)
      .addTo(map);
  });
});
